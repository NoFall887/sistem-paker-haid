name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify and package
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
          tar -C dist -czf /tmp/sistem-pakar-haid-release.tgz .

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          scp -i ~/.ssh/deploy_key -P "$VPS_PORT" -o StrictHostKeyChecking=accept-new \
            /tmp/sistem-pakar-haid-release.tgz "$VPS_USER@$VPS_HOST:/tmp/sistem-pakar-haid-release.tgz"

          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o StrictHostKeyChecking=accept-new "$VPS_USER@$VPS_HOST" <<'EOF'
            set -eu
            mkdir -p /var/www/sistem-pakar-haid
            tar -xzf /tmp/sistem-pakar-haid-release.tgz -C /var/www/sistem-pakar-haid
            rm -f /tmp/sistem-pakar-haid-release.tgz
          EOF
