<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Regression Test — Sistem Pakar Fikih Haid</title>
    <style>
      body {
        max-width: 900px;
        margin: 32px auto;
        padding: 0 16px;
        color: #222;
        font-family: "Segoe UI", sans-serif;
      }
      h1 {
        color: #660c0c;
      }
      #summary {
        margin: 16px 0;
        padding: 12px;
        border-radius: 8px;
        background: #f3efe6;
        font-weight: 700;
      }
      .pass {
        color: #1b5e20;
      }
      .fail {
        color: #b71c1c;
      }
      li {
        margin: 8px 0;
      }
      iframe {
        position: absolute;
        width: 1px;
        height: 1px;
        border: 0;
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <h1>Regression Test Logika Sistem</h1>
    <p>
      Runner ini menguji HTML kanonis melalui formulir dan keluaran aplikasinya.
    </p>
    <div id="summary">Memuat aplikasi…</div>
    <ol id="results"></ol>
    <iframe
      id="appFrame"
      src="SISTEM_PAKAR_FIQIH_HAID_MASTER.html"
      title="Aplikasi yang diuji"
    ></iframe>

    <script>
      const frame = document.getElementById("appFrame");
      const summary = document.getElementById("summary");
      const results = document.getElementById("results");
      const tests = [];
      let app;
      let doc;
      let lastAlert = "";

      function assert(condition, message) {
        if (!condition) throw new Error(message);
      }

      function test(name, run) {
        tests.push({ name, run });
      }

      function addSegment(start, end, warna = "MERAH", sifat = "CAIR") {
        const [startDate, startTime] = start.split("T");
        const [endDate, endTime] = end.split("T");
        app.addRowSegmen(
          startDate,
          startTime,
          endDate,
          endTime,
          warna,
          sifat,
        );
      }

      function setCase(status, segments, adatHaid = 7) {
        app.loadPreset("mubtadaah_ghayr");
        doc.getElementById("bloodLogTableBody").innerHTML = "";
        doc.getElementById("userStatus").value = status;
        doc.getElementById("adatHaidHari").value = adatHaid;
        app.toggleAdatInputs();
        segments.forEach((segment) => addSegment(...segment));
        lastAlert = "";
      }

      function runAnalysis() {
        app.prosesAnalisisFikihMasterDefinitif();
      }

      function snapshot() {
        return {
          kategori: doc.getElementById("badgeKategori").innerText.trim(),
          ringkasan: doc
            .getElementById("ringkasanEksekutif")
            .innerText.replace(/\s+/g, " ")
            .trim(),
          rows: Array.from(
            doc.querySelectorAll("#tabelHasilSegmenBody tr"),
          ).map((tr) =>
            Array.from(tr.querySelectorAll("td")).map((td) =>
              td.innerText.replace(/\s+/g, " ").trim(),
            ),
          ),
          mandi: doc.getElementById("guideMandi").innerText.trim(),
          shalat: doc.getElementById("guideShalat").innerText.trim(),
          puasa: doc.getElementById("guidePuasa").innerText.trim(),
          jima: doc.getElementById("guideJima").innerText.trim(),
          adat: doc
            .getElementById("boxAdatBaru")
            .innerText.replace(/\s+/g, " ")
            .trim(),
        };
      }

      function analyze(status, segments, adatHaid = 7) {
        setCase(status, segments, adatHaid);
        runAnalysis();
        assert(!lastAlert, `Analisis menampilkan alert: ${lastAlert}`);
        return snapshot();
      }

      function assertSame(actual, expected, message) {
        assert(JSON.stringify(actual) === JSON.stringify(expected), message);
      }

      function setupTests() {
        const full22 = [
          ["2026-02-01T06:00", "2026-02-23T06:00", "MERAH", "CAIR"],
        ];
        const split22 = [
          ["2026-02-01T06:00", "2026-02-12T06:00", "MERAH", "CAIR"],
          ["2026-02-12T06:00", "2026-02-23T06:00", "MERAH", "CAIR"],
        ];
        const splitThree22 = [
          ["2026-02-01T06:00", "2026-02-05T06:00", "MERAH", "CAIR"],
          ["2026-02-05T06:00", "2026-02-14T06:00", "MERAH", "CAIR"],
          ["2026-02-14T06:00", "2026-02-23T06:00", "MERAH", "CAIR"],
        ];

        test("Mubtada'ah 22 hari invariant terhadap pembagian baris", () => {
          const one = analyze("MUBTADAH", full22);
          const two = analyze("MUBTADAH", split22);
          const three = analyze("MUBTADAH", splitThree22);
          assertSame(two, one, "Hasil dua baris berbeda dari satu baris.");
          assertSame(three, one, "Hasil tiga baris berbeda dari satu baris.");
          assert(one.kategori === "MUBTADA'AH GHOIRU MUMAYYIZAH", "Kategori salah.");
          assert(one.rows.length === 2, "Keluaran harus terdiri dari dua segmen hukum.");
          assert(one.rows[0][2].includes("1.0 Hari"), "Haid harus 1 hari.");
          assert(one.rows[1][2].includes("21.0 Hari"), "Istihadhah harus 21 hari.");
        });

        test("Mu'tadah 22 hari invariant terhadap pembagian baris", () => {
          const one = analyze("MUTADAH", full22, 7);
          const split = analyze("MUTADAH", split22, 7);
          assertSame(split, one, "Hasil Mu'tadah berubah ketika baris dipecah.");
          assert(one.kategori === "MU'TADAH GHOIRU MUMAYYIZAH", "Kategori salah.");
          assert(one.rows[0][2].includes("7.0 Hari"), "Haid harus sesuai adat 7 hari.");
          assert(one.rows[1][2].includes("15.0 Hari"), "Istihadhah harus 15 hari.");
        });

        test("Perubahan sifat dengan tamyiz gagal tetap memakai episode kontinu", () => {
          const result = analyze("MUBTADAH", [
            ["2026-02-01T06:00", "2026-02-06T06:00", "MERAH", "CAIR"],
            ["2026-02-06T06:00", "2026-02-11T06:00", "HITAM", "KENTAL"],
            ["2026-02-11T06:00", "2026-02-23T06:00", "MERAH", "CAIR"],
          ]);
          assert(result.kategori === "MUBTADA'AH GHOIRU MUMAYYIZAH", "Salah routing.");
          assert(result.rows[0][2].includes("1.0 Hari"), "Haid harus 1 hari.");
        });

        test("Tamyiz sah diagregasi menjadi satu blok kuat dan satu blok lemah", () => {
          const one = analyze("MUBTADAH", [
            ["2026-02-01T06:00", "2026-02-06T06:00", "HITAM", "KENTAL"],
            ["2026-02-06T06:00", "2026-02-24T06:00", "MERAH", "CAIR"],
          ]);
          const split = analyze("MUBTADAH", [
            ["2026-02-01T06:00", "2026-02-03T06:00", "HITAM", "KENTAL"],
            ["2026-02-03T06:00", "2026-02-06T06:00", "HITAM", "KENTAL"],
            ["2026-02-06T06:00", "2026-02-15T06:00", "MERAH", "CAIR"],
            ["2026-02-15T06:00", "2026-02-24T06:00", "MERAH", "CAIR"],
          ]);
          assertSame(split, one, "Tamyiz berubah akibat pembagian baris.");
          assert(one.kategori === "MUBTADA'AH MUMAYYIZAH", "Kategori tamyiz salah.");
          assert(one.rows.length === 2, "Tamyiz harus menghasilkan dua blok hukum.");
          assert(one.adat.includes("5.0 Hari"), "Adat baru harus memakai seluruh blok kuat.");
        });

        test("Gap satu menit menggagalkan kontinuitas tamyiz", () => {
          const result = analyze("MUBTADAH", [
            ["2026-02-01T06:00", "2026-02-06T06:00", "HITAM", "KENTAL"],
            ["2026-02-06T06:01", "2026-02-24T06:01", "MERAH", "CAIR"],
          ]);
          assert(result.kategori !== "MUBTADA'AH MUMAYYIZAH", "Gap dianggap tamyiz sah.");
        });

        test("Pola kuat-lemah-kuat tetap ditolak", () => {
          const result = analyze("MUBTADAH", [
            ["2026-02-01T06:00", "2026-02-04T06:00", "HITAM", "KENTAL"],
            ["2026-02-04T06:00", "2026-02-20T06:00", "MERAH", "CAIR"],
            ["2026-02-20T06:00", "2026-02-23T06:00", "HITAM", "KENTAL"],
          ]);
          assert(result.kategori === "MUBTADA'AH GHOIRU MUMAYYIZAH", "Pola selang-seling lolos.");
        });

        test("Baris kosong total diabaikan", () => {
          const baseline = analyze("MUBTADAH", full22);
          setCase("MUBTADAH", full22);
          app.addRowSegmen();
          runAnalysis();
          assert(!lastAlert, `Baris kosong memicu alert: ${lastAlert}`);
          assertSame(snapshot(), baseline, "Baris kosong mengubah hasil.");
        });

        test("Baris parsial menghentikan analisis", () => {
          setCase("MUBTADAH", []);
          app.addRowSegmen("2026-02-01", "06:00", "", "06:00");
          runAnalysis();
          assert(lastAlert.includes("Baris 1") && lastAlert.includes("lengkap"), "Pesan tidak spesifik.");
          assert(doc.getElementById("hasilContainer").style.display === "none", "Hasil lama masih tampil.");
        });

        test("Waktu akhir sebelum mulai ditolak", () => {
          setCase("MUBTADAH", [
            ["2026-02-02T06:00", "2026-02-01T06:00", "MERAH", "CAIR"],
          ]);
          runAnalysis();
          assert(lastAlert.includes("waktu akhir harus setelah"), "Waktu terbalik tidak ditolak.");
        });

        test("Overlap ditolak, adjacency diterima", () => {
          setCase("MUBTADAH", [
            ["2026-02-01T06:00", "2026-02-10T06:00", "MERAH", "CAIR"],
            ["2026-02-09T06:00", "2026-02-23T06:00", "MERAH", "CAIR"],
          ]);
          runAnalysis();
          assert(lastAlert.includes("overlap"), "Overlap tidak ditolak.");

          const adjacent = analyze("MUBTADAH", split22);
          assert(
            adjacent.rows.every((row) => !row[2].includes("0.0 Hari")),
            "Adjacency menghasilkan segmen 0 jam.",
          );
        });

        test("Seluruh preset lama selesai tanpa error", () => {
          const presets = [
            "kasus_5kd_berantai",
            "mubtadaah_mumayyizah",
            "mubtadaah_ghayr",
            "mutadah_ghayr",
            "haid_taqatthu_jam",
            "takmil_sisa_pecahan",
            "dzakirah_waqt",
            "dzakirah_qadr",
            "mutahayyirah",
            "tamyiz_tidak_sah",
          ];
          presets.forEach((preset) => {
            lastAlert = "";
            app.loadPreset(preset);
            runAnalysis();
            assert(!lastAlert, `${preset} menampilkan alert: ${lastAlert}`);
            assert(
              doc.getElementById("badgeKategori").innerText.trim(),
              `${preset} tidak menghasilkan kategori.`,
            );
          });
        });
      }

      frame.addEventListener("load", async () => {
        app = frame.contentWindow;
        doc = frame.contentDocument;
        app.alert = (message) => {
          lastAlert = String(message);
        };
        setupTests();

        let passed = 0;
        for (const item of tests) {
          const li = document.createElement("li");
          try {
            await item.run();
            passed++;
            li.className = "pass";
            li.textContent = `PASS — ${item.name}`;
          } catch (error) {
            li.className = "fail";
            li.textContent = `FAIL — ${item.name}: ${error.message}`;
          }
          results.appendChild(li);
        }

        const failed = tests.length - passed;
        summary.className = failed === 0 ? "pass" : "fail";
        summary.textContent = `${passed}/${tests.length} lulus; ${failed} gagal.`;
        document.title = failed === 0 ? "PASS — Regression Test" : "FAIL — Regression Test";
      });
    </script>
  </body>
</html>
